const n2=x=>String(Math.round(x*100)/100),dopts=v=>opts(db.fm.map(x=>x.n),v,1).replace('— انتخاب —','Drug'),ropts=v=>opts(db.rt,v,1).replace('— انتخاب —','Route'),qopts=v=>opts(db.fq,v,1).replace('— انتخاب —','Freq'),fopts=v=>'<option value="">Form</option>'+Object.keys(FRM).map(k=>`<option value="${k}" ${k==v?'selected':''}>${k} — ${FRM[k]}</option>`).join('');
function concOf(f,fm){if(!f)return null;const m={Inj:['cn','mg/ml'],Syp:['sy','mg/ml'],Susp:['sy','mg/ml'],Drop:['dr','mg/ml'],Tab:['tb','mg/tab'],Cap:['tb','mg/cap']}[fm];if(!m)return null;const v=parseFloat(en(f[m[0]]));return v>0?{v,u:m[1]}:null}
function rxrow(i={}){return`<div class=rxr><select data-d style="grid-column:1/-1" onchange="rxc(this.closest('.rxr'),2)">${dopts(i.drug)}</select><select data-f onchange="const r=this.closest('.rxr');delete r.querySelector('.ramt').dataset.a;rxc(r,0)">${fopts(i.fm)}</select><select data-r onchange="rxc(this.closest('.rxr'),1)">${ropts(i.method)}</select><select data-q>${qopts(i.fq)}</select><input class=rmg placeholder="mg" inputmode=decimal value="${esc(i.dose)}" oninput="this.dataset.m=1;const r=this.closest('.rxr');rxa(r);rxh(r)"><input class=ramt placeholder="${UNIT[i.fm]||'qty'}" inputmode=decimal value="${esc(i.amt)}" oninput="this.dataset.a=1;rxh(this.closest('.rxr'))"><input class=rdur placeholder="days" value="${esc(i.dur)}"><div class=rxh></div><button type=button class="s d" style="grid-column:1/-1;justify-self:start" onclick="this.closest('.rxr').remove()">${I('trash',15)}</button></div>`}
function rate(row){const p=pOf($('#f_pid').value),f=db.fm.find(x=>x.n==row.querySelector('[data-d]').value),rt=row.querySelector('[data-r]').value,k=SPK[p.sp]||'';const v=f&&k&&rt?parseFloat(en(f[k+rt])):NaN;return{p,f,rt,k,v:isNaN(v)?0:v}}
function rxa(row){const g=s=>row.querySelector(s),c=concOf(rate(row).f,g('[data-f]').value),mg=parseFloat(en(g('.rmg').value));if(c&&mg&&!g('.ramt').dataset.a)g('.ramt').value=n2(mg/c.v)}
const hasD=(f,k,m)=>f&&k&&(f[k+m]||f[k+m+'_f']||f[k+m+'_d']);
function rxf(row,force){const g=z=>row.querySelector(z),q=rate(row),kk=q.f&&q.k&&q.rt?q.k+q.rt:'';if(!kk)return;const pf=q.f[kk+'_f'],pd=q.f[kk+'_d'],sl=g('[data-q]');if(pf&&(force||!sl.value)){if(![...sl.options].some(o=>o.value==pf))sl.add(new Option(pf,pf));sl.value=pf}if(pd&&(force||!g('.rdur').value))g('.rdur').value=pd}
function rxc(row,auto){const g=z=>row.querySelector(z);let q=rate(row);
if(auto==2&&q.f&&q.k){const cur=g('[data-r]').value;if(!cur||!hasD(q.f,q.k,cur)){const rr=db.rt.find(m=>hasD(q.f,q.k,m));if(rr){g('[data-r]').value=rr;q=rate(row)}}}
if(auto){const fm=g('[data-f]');if(!fm.value&&['IM','IV','SC'].includes(g('[data-r]').value))fm.value='Inj';if(q.v&&q.p.w){g('.rmg').value=n2(q.v*q.p.w/1000);delete g('.rmg').dataset.m;delete g('.ramt').dataset.a}rxf(row,true)}rxa(row);rxh(row)}
function rxh(row){const g=s=>row.querySelector(s),h=g('.rxh'),q=rate(row),fm=g('[data-f]').value,mg=parseFloat(en(g('.rmg').value));g('.ramt').placeholder=UNIT[fm]||'qty';let t='';if(!g('[data-d]').value){h.textContent='';return}
if(q.rt){if(!q.k)t='Auto dose / freq / days work for dog, cat & bird only.';else if(!q.p.w)t='Pet weight is not recorded.';else if(!q.v)t='No reference dose for this drug / route / species - set it in Drug manager.';else t=`${n2(q.v)} mg/kg x ${n2(q.p.w/1000)} kg = ${n2(q.v*q.p.w/1000)} mg`}
const c=concOf(q.f,fm);if(c&&mg)t+=(t?'  =>  ':'')+`${n2(mg/c.v)} ${UNIT[fm]} @ ${c.v} ${c.u}`;const kk=q.f&&q.k&&q.rt?q.k+q.rt:'';if(kk){const mf=!q.f[kk+'_f'],md=!q.f[kk+'_d'];if(mf||md)t+=(t?'  |  ':'')+'No '+[mf?'freq':'',md?'days':''].filter(Boolean).join(' / ')+' saved for '+{d:'Dog',c:'Cat',b:'Bird'}[q.k]+' '+q.rt+' in Drug manager.'}h.textContent=t}
function fmEd(){const q=window.fmS||'';$('#pk').innerHTML=`<div class=bx dir=ltr style="text-align:left"><b>Drugs, doses &amp; concentrations</b><small style="display:block;color:var(--m)">Enter reference doses (mg/kg), frequency and days yourself from a trusted formulary. They fill the prescription automatically; the app only multiplies by body weight - always verify before prescribing.</small>
<input id=fs placeholder="Search drug (first letters)..." value="${esc(q)}" oninput="fmFilter(this.value)" style="margin-top:8px">
<div class=df style="margin:8px 0"><input id=fn placeholder="New drug"><button type=button onclick="const v=$('#fn').value.trim();if(v&&!db.fm.some(x=>x.n==v)){db.fm.push({n:v});sortFm();save();window.fmF=v;window.fmS=''}fmEd()">+</button></div>
${db.fm.map((x,i)=>`<div class=card data-n="${esc(x.n)}" style="margin:8px 0;padding:10px"><div class=df><input value="${esc(x.n)}" onchange="fmSet(${i},'n',this.value);fmEd()"><button type=button class=d onclick="if(confirm('Delete?')){db.fm.splice(${i},1);save();fmEd()}">${I('trash',18)}</button></div>${[['d','Dog'],['c','Cat'],['b','Bird']].map(([k,l])=>`<label>${l} - dose (mg/kg) / freq / days</label><div class=fm3 style="grid-template-columns:repeat(${db.rt.length},minmax(0,1fr))">${db.rt.map(m=>{const key=k+m;return`<div><small>${esc(m)}</small><input placeholder="mg/kg" inputmode=decimal value="${esc(x[key])}" onchange="fmSet(${i},'${key}',this.value)"><select onchange="fmSet(${i},'${key}_f',this.value)">${opts(db.fq,x[key+'_f'],1).replace('— انتخاب —','freq')}</select><input placeholder="days" value="${esc(x[key+'_d'])}" onchange="fmSet(${i},'${key}_d',this.value)"></div>`}).join('')}</div>`).join('')}<label>Concentration</label><div class=fm3 style="grid-template-columns:repeat(4,minmax(0,1fr))"><div><small>Inj (mg/ml)</small><input inputmode=decimal value="${esc(x.cn)}" onchange="fmSet(${i},'cn',this.value)"></div><div><small>Tab/Cap (mg/unit)</small><input inputmode=decimal value="${esc(x.tb)}" onchange="fmSet(${i},'tb',this.value)"></div><div><small>Syp/Susp (mg/ml)</small><input inputmode=decimal value="${esc(x.sy)}" onchange="fmSet(${i},'sy',this.value)"></div><div><small>Drop (mg/ml)</small><input inputmode=decimal value="${esc(x.dr)}" onchange="fmSet(${i},'dr',this.value)"></div></div></div>`).join('')}<p><button class=p onclick="closeFm()">Done</button></p></div>`;$('#pk').classList.add('on');fmFilter(q);if(window.fmF){const c=[...document.querySelectorAll('#pk .card')].find(e=>e.dataset.n==window.fmF);if(c)c.scrollIntoView({block:'center'});window.fmF=0}}
function fmFilter(q){window.fmS=q;q=q.trim().toLowerCase();const C=[...document.querySelectorAll('#pk .card[data-n]')],st=n=>{n=n.toLowerCase();return n.startsWith(q)||n.includes(' '+q)||n.includes('-'+q)},any=C.some(c=>st(c.dataset.n));C.forEach(c=>{const n=c.dataset.n.toLowerCase();c.style.display=!q||(any?st(c.dataset.n):n.includes(q))?'':'none'})}
function fmSet(i,k,v){v=en(v).trim();if(k=='n'&&!v)return;const o=db.fm[i];o[k]=v;if(k=='n'){sortFm();window.fmF=v}save()}
function closeFm(){$('#pk').classList.remove('on');document.querySelectorAll('#rxl select[data-d]').forEach(e=>{const v=e.value;e.innerHTML=dopts(v);e.value=v});document.querySelectorAll('#rxl .rxr').forEach(r=>{if(r.querySelector('[data-d]').value){if(r.querySelector('.rmg').dataset.m)rxf(r,false);else rxc(r,r.querySelector('[data-r]').value?1:2)}rxa(r);rxh(r)})}
function openRec(t,id,pid){const x=id?db.r.find(y=>y.id==id):{},C=T[t];pid=pid||x.pid;
$('#md').innerHTML=`<div class=bx><h3>${C.n}</h3><label>حیوان</label><select id=f_pid>${db.p.map(p=>`<option value=${p.id} ${p.id==pid?'selected':''}>${esc(p.name)} (${esc(oOf(p).name)})</option>`).join('')}</select><label>تاریخ</label>${dfield('f_date',x.date||TJ)}
${C.f.map(([k,l,ty,o])=>`<label>${l}</label>`+(ty=='t'?`<textarea id=f_${k}>${esc(x[k])}</textarea>`:ty=='i'?`<input id=f_${k} value="${esc(x[k])}">`:ty=='s'?`<select id=f_${k}>${o.map(v=>`<option ${v==x[k]?'selected':''}>${v}</option>`).join('')}</select>`:ty=='b'?`<select id=f_${k}>${opts(o,x[k],1)}</select>`:ty=='L'?`<div class=df><select id=f_${k} data-l=${o}>${opts(db[o],x[k],1)}</select><button type=button onclick="listEd('${o}')">${I('settings',18)}</button></div>`:ty=='d'?dfield('f_'+k,x[k]||(t=='rx'&&!id&&k=='next'?jplus(10):'')):ty=='img'?imgf('f_'+k,x[k]):ty=='care'?careBox(x[k]):`<div id=rxl dir=ltr>${(x.items&&x.items.length?x.items:[{}]).map(rxrow).join('')}</div><button type=button class=s onclick="$('#rxl').insertAdjacentHTML('beforeend',rxrow())">+ قلم دارویی</button><button type=button class=s onclick="fmEd()">مدیریت داروها و دوزها</button><button type=button class=s onclick="listEd('rt')">مدیریت روش‌ها</button><button type=button class=s onclick="listEd('fq')">مدیریت دفعات تکرار</button>`)).join('')}
<p><button class=p onclick="fsave('${t}','${id||''}')">ذخیره</button> <button class=s onclick="cl()">انصراف</button></p></div>`;$('#md').classList.add('on');if(document.querySelector('#rxl')){document.querySelectorAll('#rxl .rxr').forEach(rxh);$('#f_pid').onchange=()=>document.querySelectorAll('#rxl .rxr').forEach(r=>{if(!r.querySelector('input').dataset.m)rxc(r,1)})}}
function fsave(t,id){if(!db.p.length){alert('ابتدا بیمار ثبت کنید');return}try{const x={id:id||uid(),t,pid:$('#f_pid').value,date:normd('f_date')||TJ};
T[t].f.forEach(([k,l,ty])=>{x[k]=ty=='d'?normd('f_'+k):ty=='img'?IM['f_'+k]||'':ty=='care'?[...document.querySelectorAll('#f_care input:checked')].map(i=>i.value):ty=='rx'?[...document.querySelectorAll('#rxl .rxr')].map(r=>{const g=z=>r.querySelector(z),dg=g('[data-d]').value,fm=g('[data-f]').value,c=concOf(db.fm.find(x=>x.n==dg),fm);return{drug:dg,fm,dose:g('.rmg').value,amt:g('.ramt').value,method:g('[data-r]').value,fq:g('[data-q]').value,dur:g('.rdur').value,conc:c?c.v+' '+c.u:''}}).filter(i=>i.drug):$('#f_'+k).value});
if(id){const i=db.r.findIndex(y=>y.id==id);if(db.r[i].next!=x.next)x.done=0;else x.done=db.r[i].done;db.r[i]=x}else db.r.push(x);save();cl()}catch(e){}}
function pform(id,oid){const p=id?pOf(id):{},o=id?oOf(p):oid?db.o.find(z=>z.id==oid):{};IM.pf=p.ph||'';
$('#md').innerHTML=`<div class=bx><h3>${id?'ویرایش':'ثبت'} پرونده</h3><label>نام صاحب حیوان</label><input id=o_n value="${esc(o.name)}"><label>شماره تلفن</label><input id=o_p inputmode=tel value="${esc(o.phone)}">
<label>نام حیوان</label><input id=p_n value="${esc(p.name)}"><label>گونه</label><select id=p_s>${SP.map(s=>`<option ${s==p.sp?'selected':''}>${s}</option>`).join('')}</select><label>نژاد</label><input id=p_b value="${esc(p.breed)}"><label>جنس</label><select id=p_x>${['نر','ماده','نر عقیم‌شده','ماده عقیم‌شده'].map(s=>`<option ${s==p.sex?'selected':''}>${s}</option>`).join('')}</select>
<label>تاریخ تولد (سن خودکار محاسبه می‌شود)</label>${dfield('p_d',p.birth)}<label>وزن</label><div class=df><input id=p_w inputmode=decimal value="${p.w?p.w:''}"><select id=p_u style="width:110px"><option>گرم</option><option>کیلوگرم</option></select></div>
<label>شماره میکروچیپ</label><input id=p_c value="${esc(p.chip)}"><label>حساسیت دارویی</label><textarea id=p_a>${esc(p.alg)}</textarea><label>بیماری‌های زمینه‌ای</label><textarea id=p_i>${esc(p.dis)}</textarea><label>عکس حیوان</label>${imgf('pf',p.ph)}
<p><button class=p onclick="psave('${id||''}','${oid||''}')">ذخیره</button> <button class=s onclick="cl()">انصراف</button></p></div>`;$('#md').classList.add('on')}
function psave(id,oid){try{const n=$('#p_n').value.trim(),on=$('#o_n').value.trim(),ph=en($('#o_p').value).trim();if(!n||!on){alert('نام حیوان و صاحب لازم است');return}
let w=parseFloat(en($('#p_w').value))||0;if($('#p_u').value=='کیلوگرم')w=Math.round(w*1000);
let o=db.o.find(z=>z.id==oid)||db.o.find(z=>ph&&z.phone==ph&&z.name==on);const old=id?pOf(id):null;if(id&&!oid)o=oOf(old);if(!o){o={id:uid()};db.o.push(o)}o.name=on;o.phone=ph;
const p=Object.assign(old||{id:uid()},{oid:o.id,name:n,sp:$('#p_s').value,breed:$('#p_b').value,sex:$('#p_x').value,birth:normd('p_d'),w,chip:en($('#p_c').value),alg:$('#p_a').value,dis:$('#p_i').value,ph:IM.pf});
if(!id)db.p.push(p);save();$('#md').classList.remove('on');go('pet',{id:p.id})}catch(e){}}
r();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
